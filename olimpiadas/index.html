<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resoluções - olimpíadas dos professores</title>
</head>
<body>
    <h1>Olá!</h1>
    <p style="font-size: 24px;">
        As resoluções das questões estarão disponíveis aqui a partir do dia <b>19 ou 20/10</b>.<br>
        Obrigado pela participação!
    </p>
    <a id="a" style="font-size: 24px;" onclick="acessar=true;">Carregando questões...</a>

    <script>let url, acessar;</script>
    <script type="module">
        import { app, db } from "./firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        async function baixarPDF() {
            try {
                const docSnapsot = await getDoc(doc(db, "p", "q"));
                if (docSnapsot.exists()) {

                    const uint8Array = docSnapsot.data().dados.toUint8Array();
                    const blob = new Blob([uint8Array], { type: "application/pdf" });

                    url = URL.createObjectURL(blob);
                    console.log("PDF disponível");

                    const a = document.getElementById("a");
                    a.href = url;
                    a.innerText = "Clique aqui para ver as questões";
                    if (acessar) {
                        window.open(url, "_blank");
                    }

                } else {
                    console.log("Documento não encontrado!");
                }
            } catch (error) {
                console.error("Erro ao buscar o PDF:", error);
            }
        }
        baixarPDF();
    </script>
</body>
</html>
