<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em breve - 23/10 - olimpíadas dos professores</title>
</head>
<body>
    <h1>Olá!</h1>
    <p style="font-size: 24px;">
        Perdão pelo transtorno! A data precisou ser adiada.
        As resoluções das questões estarão disponíveis aqui dia <b>23/10</b>.<br>
        Obrigado pela participação!
    </p>
    <!--
    <a id="r" style="font-size: 24px;">Carregando respostas...</a><br>
    ou<br>
    -->
    <a id="q" style="font-size: 24px;">Carregando questões...</a>

    <script>let url, acessar;</script>
    <script type="module">
        import { app, db } from "./firebase.js";
        import { doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        async function baixarPDF(nome) {
            try {
                const docSnapsot = await getDoc(doc(db, "p", nome));
                if (docSnapsot.exists()) {
                    const uint8Array = docSnapsot.data().dados.toUint8Array();
                    const blob = new Blob([uint8Array], { type: "application/pdf" });
                    url = URL.createObjectURL(blob);
                    console.log("PDF disponível");

                    const a = document.getElementById(nome);
                    a.href = url;
                    a.innerText = (nome === 'r') ? "VER RESPOSTAS" : "ver apenas as questões";
                    if (acessar === nome) {
                        window.open(url, "_blank");
                    }
                } else {
                    console.log("Documento não encontrado!");
                }
            } catch (error) {
                console.error("Erro ao buscar o PDF:", error);
            }
        }
        baixarPDF('q');
        //baixarPDF('r'); (tirar do comentário aqui) ---------------------------------------------------------
        updateDoc(doc(db, "p", "d"), { n: increment(1) });
    </script>
</body>
</html>
